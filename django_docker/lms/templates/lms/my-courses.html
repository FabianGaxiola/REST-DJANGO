<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mis cursos</title>
</head>
<body>
  <h1>Mis cursos</h1>

  <p><a href="{% url 'course_list' %}">← Ver todos los cursos</a></p>

  {% if courses %}
    <ul>
      {% for course in courses %}
        <li>
          <a href="{% url 'course_detail' course.id %}">
            {{ course.lesson }}
          </a>
          (progreso: {{ course.progress }} %)
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No estás inscrito en ningún curso.</p>
  {% endif %}
</body>
</html>
